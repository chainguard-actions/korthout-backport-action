name: Test default inputs and label pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: backport_defaults
        uses: .
        continue-on-error: true
        with:
          # Use default label_pattern and a non-existent PR
          source_pr_number: "99999"
          label_pattern: "^backport ([^ ]+)$"
          branch_name: "backport-${pull_number}-to-${target_branch}"
          pull_title: "[Backport ${target_branch}] ${pull_title}"
          github_token: ${{ github.token }}

      - name: Assert action ran with default inputs
        env:
          OUTCOME: ${{ steps.backport_defaults.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: expected step outcome to be set"
            exit 1
          fi
          # The action should fail (no real PR) or succeed — either is valid
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with default inputs, outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - id: backport_invalid_merge_commits
        uses: .
        continue-on-error: true
        with:
          source_pr_number: "99999"
          merge_commits: "invalid_value"
          github_token: ${{ github.token }}

      - name: Assert action fails on invalid merge_commits value
        env:
          OUTCOME: ${{ steps.backport_invalid_merge_commits.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid merge_commits value, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid merge_commits='invalid_value'"

      - id: backport_invalid_comment_style
        uses: .
        continue-on-error: true
        with:
          source_pr_number: "99999"
          comment_style: "invalid_style"
          github_token: ${{ github.token }}

      - name: Assert action fails on invalid comment_style value
        env:
          OUTCOME: ${{ steps.backport_invalid_comment_style.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid comment_style value, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid comment_style='invalid_style'"
