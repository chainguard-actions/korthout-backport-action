name: Test backport action with explicit target_branches input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          target_branches: main
          merge_commits: skip
          cherry_picking: pull_request_head
        continue-on-error: true

      - name: Assert action outputs
        env:
          WAS_SUCCESSFUL: ${{ steps.action.outputs.was_successful }}
          CREATED_PRS: ${{ steps.action.outputs.created_pull_numbers }}
        run: |
          echo "was_successful: $WAS_SUCCESSFUL"
          echo "created_pull_numbers: $CREATED_PRS"
          # Under workflow_dispatch there is no merged PR context.
          # The action is expected to either:
          # - Return was_successful=false (no source PR found)
          # - Or error out (continue-on-error=true keeps the workflow alive)
          # In either case, no PRs should have been created.
          if [ "$WAS_SUCCESSFUL" = "true" ]; then
            # If somehow successful, no PRs should be created (nothing to backport)
            echo "was_successful=true"
            if [ -n "$CREATED_PRS" ]; then
              echo "FAIL: unexpected PRs created: $CREATED_PRS"
              exit 1
            fi
            echo "PASS: no PRs created"
          elif [ "$WAS_SUCCESSFUL" = "false" ]; then
            echo "PASS: action correctly reported failure (no source PR in workflow_dispatch context)"
          else
            echo "INFO: action errored before producing outputs (expected under workflow_dispatch)"
            echo "PASS: action ran without crashing the workflow"
          fi
