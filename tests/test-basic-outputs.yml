name: Test basic outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: backport
        uses: .
        continue-on-error: true
        with:
          # Use a non-existent PR number so the action runs but fails gracefully
          source_pr_number: "99999"
          target_branches: "release-1.0"
          github_token: ${{ github.token }}

      - name: Assert action ran (step outcome is set)
        env:
          OUTCOME: ${{ steps.backport.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: expected step outcome to be set"
            exit 1
          fi
          echo "PASS: step outcome is '$OUTCOME'"

      - name: Assert action failed as expected (no real PR exists)
        env:
          OUTCOME: ${{ steps.backport.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          # The action should fail because PR 99999 doesn't exist in this repo
          # This confirms the action ran and attempted the GitHub API call
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran and produced a definitive outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
