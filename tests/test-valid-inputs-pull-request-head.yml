name: Test valid inputs with pull_request_head cherry_picking
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With cherry_picking=pull_request_head and merge_commits=skip, the action
      # should pass all input validation. It will then fail at the GitHub API
      # stage (no PR in workflow_dispatch context), but NOT with a validation error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          cherry_picking: pull_request_head
          merge_commits: skip
          comment_style: legacy
          auto_merge_method: squash

      - name: Assert action did not fail due to input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (no PR context under workflow_dispatch),
          # but it must NOT succeed unexpectedly either.
          # The key assertion: it must have run (not skipped) and the failure
          # must be from the API stage, not from input validation.
          # We verify the outcome is 'failure' (API error) not 'success'
          # (which would be unexpected) — this confirms the action ran and
          # passed validation before hitting the API.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at API stage (past input validation) as expected"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
