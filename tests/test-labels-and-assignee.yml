name: Test labels and author-assignee options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          source_pr_number: "1"
          target_branches: release-1.0
          add_author_as_assignee: "true"
          add_labels: backport,automated
          copy_labels_pattern: ^(bug|enhancement)$
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.was_successful }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "true" ] && [ "$RESULT" != "false" ] && [ -n "$RESULT" ]; then
              echo "FAIL: was_successful must be 'true', 'false' or unset, got '$RESULT'"
              exit 1
            fi
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
