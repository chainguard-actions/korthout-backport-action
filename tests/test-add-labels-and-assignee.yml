name: Test add_labels and add_author_as_assignee inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Use a source_pr_number that doesn't exist so the action fails gracefully
          source_pr_number: "999999999"
          target_branches: "nonexistent-branch"
          add_author_as_assignee: "true"
          add_labels: "backport,automated"
        continue-on-error: true
      - name: Assert was_successful output is present
        env:
          WAS_SUCCESSFUL: ${{ steps.action.outputs.was_successful }}
        run: |
          echo "was_successful: $WAS_SUCCESSFUL"
          # The action should have run and produced an output (either true or false)
          # With a non-existent PR, it should be false or empty
          if [ "$WAS_SUCCESSFUL" = "true" ]; then
            echo "FAIL: expected action to not succeed with a non-existent PR"
            exit 1
          fi
          echo "PASS: action handled non-existent PR gracefully (was_successful=$WAS_SUCCESSFUL)"
