name: Test conflicting reviewer options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          copy_requested_reviewers: "true"
          add_author_as_reviewer: "true"
          source_pr_number: "1"
      - name: Assert action rejected the conflicting options
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CREATED: ${{ steps.action.outputs.created_pull_numbers }}
        run: |
          echo "outcome: $OUTCOME"
          echo "created: $CREATED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both copy_requested_reviewers and add_author_as_reviewer are true"
            exit 1
          fi
          if [ -n "$CREATED" ]; then
            echo "FAIL: no pull requests should be created"
            exit 1
          fi
          echo "PASS"
