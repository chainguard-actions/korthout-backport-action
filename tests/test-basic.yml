name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          target_branches: "nonexistent-branch"
          label_pattern: "^backport ([^ ]+)$"

      - name: Assert was_successful output is set
        env:
          WAS_SUCCESSFUL: ${{ steps.action.outputs.was_successful }}
        run: |
          echo "was_successful: $WAS_SUCCESSFUL"
          if [ -z "$WAS_SUCCESSFUL" ] && [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected was_successful to be set or action to fail"
            exit 1
          fi
          echo "PASS: action completed (was_successful='$WAS_SUCCESSFUL', outcome='${{ steps.action.outcome }}')"
