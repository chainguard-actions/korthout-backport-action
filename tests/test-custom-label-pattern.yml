name: Test backport action with custom label pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          label_pattern: '^cherry-pick ([^ ]+)$'
          branch_name: 'cherry-pick-${pull_number}-to-${target_branch}'
          comment_style: summary
        continue-on-error: true

      - name: Assert action ran and outputs are defined
        env:
          WAS_SUCCESSFUL: ${{ steps.action.outputs.was_successful }}
          CREATED_PRS: ${{ steps.action.outputs.created_pull_numbers }}
          WAS_SUCCESSFUL_BY_TARGET: ${{ steps.action.outputs.was_successful_by_target }}
        run: |
          echo "was_successful: $WAS_SUCCESSFUL"
          echo "created_pull_numbers: $CREATED_PRS"
          echo "was_successful_by_target: $WAS_SUCCESSFUL_BY_TARGET"
          # The action should either succeed (no targets found) or fail gracefully
          # (no PR event context). Either way it should not crash the workflow.
          if [ "$WAS_SUCCESSFUL" = "true" ] || [ "$WAS_SUCCESSFUL" = "false" ]; then
            echo "PASS: action produced a valid was_successful output"
          else
            echo "INFO: action may have errored before setting outputs (no PR context under workflow_dispatch)"
            echo "PASS: action ran without crashing the workflow"
          fi
