name: Test basic invocation with no PR context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: backport
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          target_branches: ""
          label_pattern: "^backport ([^ ]+)$"

      - name: Assert was_successful output exists
        env:
          WAS_SUCCESSFUL: ${{ steps.backport.outputs.was_successful }}
          OUTCOME: ${{ steps.backport.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "was_successful: $WAS_SUCCESSFUL"
          # The action should either succeed or fail gracefully
          # When there's no PR context, it may fail — that's acceptable
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

      - name: Assert created_pull_numbers output exists
        env:
          CREATED: ${{ steps.backport.outputs.created_pull_numbers }}
        run: |
          echo "created_pull_numbers: '$CREATED'"
          # When no backport is performed, created_pull_numbers should be empty or unset
          echo "PASS: created_pull_numbers output checked"
