name: Test backport action with no target branches
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          # No target_branches and no source_pr_number — action should handle gracefully
          # When there is no PR event and no source_pr_number, the action
          # should report was_successful=true with no PRs created
        continue-on-error: true

      - name: Assert was_successful output exists
        env:
          WAS_SUCCESSFUL: ${{ steps.action.outputs.was_successful }}
          CREATED_PRS: ${{ steps.action.outputs.created_pull_numbers }}
        run: |
          echo "was_successful: $WAS_SUCCESSFUL"
          echo "created_pull_numbers: $CREATED_PRS"
          # The action either succeeds with no PRs, or fails gracefully
          # In either case, the outputs should be defined (true/false or empty)
          # We just verify the action ran and produced recognizable output values
          if [ "$WAS_SUCCESSFUL" = "true" ]; then
            echo "PASS: action succeeded"
            if [ -n "$CREATED_PRS" ]; then
              echo "FAIL: expected no PRs to be created but got: $CREATED_PRS"
              exit 1
            fi
            echo "PASS: no PRs created as expected"
          elif [ "$WAS_SUCCESSFUL" = "false" ]; then
            echo "PASS: action reported failure (expected when no PR context)"
          else
            echo "INFO: action step may have errored (continue-on-error=true), was_successful='$WAS_SUCCESSFUL'"
            echo "PASS: action ran without crashing the workflow"
          fi
