name: Test source_pr_number input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          source_pr_number: "1"
          target_branches: "nonexistent-branch-xyz"
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert was_successful output is set
        env:
          WAS_SUCCESSFUL: ${{ steps.action.outputs.was_successful }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "was_successful: $WAS_SUCCESSFUL"
          # The action either succeeds with was_successful=false (no valid target)
          # or fails entirely — both are acceptable since we're just verifying
          # the source_pr_number input is accepted and processed.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with source_pr_number input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
