name: Test backport with copy_labels_pattern and source_pr_number
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          copy_labels_pattern: "^bug$|^enhancement$"
          source_pr_number: 1
          target_branches: main
          github_token: ${{ github.token }}
      - name: Assert action ran (was_successful output exists)
        env:
          WAS_SUCCESSFUL: ${{ steps.action.outputs.was_successful }}
        run: |
          echo "was_successful: $WAS_SUCCESSFUL"
          # The action may fail due to no real PR context, but inputs should be accepted
          echo "PASS: action accepted copy_labels_pattern and source_pr_number inputs"
