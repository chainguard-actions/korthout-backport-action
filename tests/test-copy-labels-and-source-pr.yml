name: Test copy_labels_pattern and source_pr_number inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          copy_labels_pattern: "^bug$|^enhancement$"
          source_pr_number: "1"
          target_branches: "main"
          github_token: ${{ github.token }}
      - name: Assert was_successful output is present
        env:
          WAS_SUCCESSFUL: ${{ steps.action.outputs.was_successful }}
        run: |
          echo "was_successful: $WAS_SUCCESSFUL"
          # Under workflow_dispatch with no real PR, the action may output false or empty.
          # We just verify the action ran and produced a recognizable output (true or false or empty).
          if [ "$WAS_SUCCESSFUL" = "true" ] || [ "$WAS_SUCCESSFUL" = "false" ] || [ -z "$WAS_SUCCESSFUL" ]; then
            echo "PASS: action ran with copy_labels_pattern and source_pr_number inputs"
          else
            echo "FAIL: unexpected was_successful value: $WAS_SUCCESSFUL"
            exit 1
          fi
