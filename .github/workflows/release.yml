name: Release
on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: The new version to release, e.g. 1.0.0
        type: string
        required: true
      nextDevelopmentVersion:
        description: >
          The new version to use during development, e.g. 1.1.0-SNAPSHOT
        type: string
        required: true
      dryRun:
        description: Don't push commits or tags
        type: boolean
        default: true
concurrency: release
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version inputs
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          NEXT_VERSION: ${{ inputs.nextDevelopmentVersion }}
        run: |
          for v in "$RELEASE_VERSION" "$NEXT_VERSION"; do
            if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              printf '::error::Invalid semver: %s\n' "$v"
              exit 1
            fi
          done

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set release version in package.json
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: |
          sed -i "s/\"version\": \"[0-9.]*\(-SNAPSHOT\)\{0,1\}\"/\"version\": \"$RELEASE_VERSION\"/" package.json
          grep -Fq "\"version\": \"$RELEASE_VERSION\"" package.json

      - name: Commit new release version
        id: commit-new-release
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        with:
          commit: --signoff
          default_author: github_actions
          fetch: false
          message: 'dist: release ${{ inputs.releaseVersion }}'
          push: ${{ inputs.dryRun == false }}
          tag: v${{ inputs.releaseVersion }}

      - name: Print new release version commit
        env:
          COMMIT_SHA: ${{ steps.commit-new-release.outputs.commit_sha }}
        run: git show "$COMMIT_SHA" | cat

      - name: Set development version in package.json
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          NEXT_VERSION: ${{ inputs.nextDevelopmentVersion }}
        run: |
          sed -i "s/\"version\": \"$RELEASE_VERSION\"/\"version\": \"$NEXT_VERSION\"/" package.json
          grep -Fq "\"version\": \"$NEXT_VERSION\"" package.json

      - name: Extract semver release version components
        uses: madhead/semver-utils@36d1e0ed361bd7b4b77665de8093092eaeabe6ba # v4.3.0
        id: version
        with:
          version: ${{ inputs.releaseVersion }}

      - name: Create and move major/minor tags
        env:
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          git tag "v$MAJOR" --force
          git tag "v$MAJOR.$MINOR" --force

      - name: Push major/minor tags
        if: ${{ inputs.dryRun == false }}
        env:
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          git push origin "v$MAJOR" --force
          git push origin "v$MAJOR.$MINOR" --force

      - name: Commit next development version
        id: commit-next-dev
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        with:
          commit: --signoff
          default_author: github_actions
          fetch: false
          message: 'dist: release ${{ inputs.nextDevelopmentVersion }}'
          push: ${{ inputs.dryRun == false }}

      - name: Print next development version commit
        env:
          COMMIT_SHA: ${{ steps.commit-next-dev.outputs.commit_sha }}
        run: git show "$COMMIT_SHA" | cat
