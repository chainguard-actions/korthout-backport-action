name: Test add_labels, add_reviewers, and auto_merge inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          source_pr_number: 1
          target_branches: main
          add_labels: backport,automated
          add_author_as_assignee: true
          add_author_as_reviewer: false
          auto_merge_enabled: false
          auto_merge_method: squash
          comment_style: summary
          github_token: ${{ github.token }}

      - name: Assert action ran with label/reviewer config or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          WAS_SUCCESSFUL: ${{ steps.action.outputs.was_successful }}
          CREATED_PRS: ${{ steps.action.outputs.created_pull_numbers }}
        run: |
          echo "outcome: $OUTCOME"
          echo "was_successful: $WAS_SUCCESSFUL"
          echo "created_pull_numbers: $CREATED_PRS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$WAS_SUCCESSFUL" ]; then
              echo "FAIL: action succeeded but was_successful output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with was_successful=$WAS_SUCCESSFUL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
