name: Test experimental conflict_resolution and copy_labels_pattern inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          source_pr_number: 1
          target_branches: v2
          # Use draft_commit_conflicts to handle conflicts gracefully
          experimental: >
            {
              "conflict_resolution": "draft_commit_conflicts"
            }
          # Copy labels matching "bug" or "enhancement" from original PR
          copy_labels_pattern: '^(bug|enhancement)$'
          copy_assignees: true
          copy_milestone: false
          github_token: ${{ github.token }}

      - name: Assert action ran with experimental config or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          WAS_SUCCESSFUL: ${{ steps.action.outputs.was_successful }}
          WAS_SUCCESSFUL_BY_TARGET: ${{ steps.action.outputs.was_successful_by_target }}
        run: |
          echo "outcome: $OUTCOME"
          echo "was_successful: $WAS_SUCCESSFUL"
          echo "was_successful_by_target: $WAS_SUCCESSFUL_BY_TARGET"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$WAS_SUCCESSFUL" ]; then
              echo "FAIL: action succeeded but was_successful output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with was_successful=$WAS_SUCCESSFUL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
