name: Test invalid cherry_picking_merge_mode input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          cherry_picking_merge_mode: aggressive
          source_pr_number: "1"
      - name: Assert action rejected the invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CREATED: ${{ steps.action.outputs.created_pull_numbers }}
        run: |
          echo "outcome: $OUTCOME"
          echo "created: $CREATED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid cherry_picking_merge_mode"
            exit 1
          fi
          if [ -n "$CREATED" ]; then
            echo "FAIL: no pull requests should be created"
            exit 1
          fi
          echo "PASS"
