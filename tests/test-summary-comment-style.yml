name: Test summary comment style with all valid options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          source_pr_number: "1"
          target_branches: release-1.0 release-2.0
          comment_style: summary
          cherry_picking: pull_request_head
          cherry_picking_merge_mode: whitespace_tolerant
          merge_commits: skip
          auto_merge_method: squash
          experimental: '{"conflict_resolution": "draft_commit_conflicts"}'
      - name: Assert action passed validation (and either succeeded or failed on sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.was_successful }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "true" ] && [ "$RESULT" != "false" ] && [ -n "$RESULT" ]; then
              echo "FAIL: was_successful must be 'true', 'false' or unset, got '$RESULT'"
              exit 1
            fi
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
