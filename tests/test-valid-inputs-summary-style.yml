name: Test valid inputs with summary comment style
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that summary comment_style and draft_commit_conflicts conflict_resolution
      # are accepted as valid inputs. The action will fail at the API stage
      # (no PR in workflow_dispatch context) but must pass input validation.
      - id: action
        uses: .
        continue-on-error: true
        with:
          comment_style: summary
          experimental: |
            {
              "conflict_resolution": "draft_commit_conflicts"
            }

      - name: Assert action did not fail due to input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the API stage (no PR context under workflow_dispatch),
          # but it must NOT fail due to input validation.
          # Both 'success' and 'failure' are acceptable here — what matters is
          # that the action ran and passed validation.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and passed input validation (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
