name: Test backport with custom label pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Custom label pattern - no labels will match under workflow_dispatch
          label_pattern: '^port-to ([^ ]+)$'
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert outputs for custom label pattern with no matches
        env:
          WAS_SUCCESSFUL: ${{ steps.action.outputs.was_successful }}
          CREATED_PULL_NUMBERS: ${{ steps.action.outputs.created_pull_numbers }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "was_successful: $WAS_SUCCESSFUL"
          echo "created_pull_numbers: '$CREATED_PULL_NUMBERS'"
          # With no matching labels and no target_branches, no backports should be created
          # The action may succeed (true) or fail due to no PR context under workflow_dispatch
          if [ "$WAS_SUCCESSFUL" = "true" ] || [ "$WAS_SUCCESSFUL" = "false" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a valid outcome"
          else
            echo "INFO: action outcome=$OUTCOME was_successful=$WAS_SUCCESSFUL"
            echo "PASS: action ran"
          fi
          # created_pull_numbers should be empty since no backport was created
          if [ -z "$CREATED_PULL_NUMBERS" ]; then
            echo "PASS: created_pull_numbers is empty as expected"
          else
            echo "INFO: created_pull_numbers: $CREATED_PULL_NUMBERS"
          fi
