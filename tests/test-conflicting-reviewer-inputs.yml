name: Test conflicting reviewer inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          copy_requested_reviewers: "true"
          add_author_as_reviewer: "true"

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both copy_requested_reviewers and add_author_as_reviewer are true, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with conflicting reviewer inputs"
