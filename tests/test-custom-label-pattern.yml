name: Test custom label pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/42/merge
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          label_pattern: "^port-to ([^ ]+)$"
          target_branches: ""

      - name: Assert action ran without unexpected crash
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "was_successful: ${{ steps.action.outputs.was_successful }}"
          # The action should either succeed (no targets) or fail gracefully
          # It should not exit with an unhandled exception
          if [ "${{ steps.action.outcome }}" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly cancelled"
            exit 1
          fi
          echo "PASS: action completed with outcome '${{ steps.action.outcome }}'"
