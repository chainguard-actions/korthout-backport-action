name: Test mutually exclusive reviewer inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          copy_requested_reviewers: "true"
          add_author_as_reviewer: "true"
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when both copy_requested_reviewers and add_author_as_reviewer are true"
            exit 1
          fi
          echo "PASS: action correctly failed when mutually exclusive reviewer inputs are both enabled"
