name: Test invalid experimental conflict_resolution value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          experimental: |
            {
              "conflict_resolution": "invalid-value"
            }
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid conflict_resolution in experimental"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid conflict_resolution value"
