name: Test basic backport action invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_pr_number: "1"
          target_branches: "main"
          label_pattern: "^backport ([^ ]+)$"

      - name: Assert was_successful output exists
        env:
          WAS_SUCCESSFUL: ${{ steps.action.outputs.was_successful }}
        run: |
          echo "was_successful: $WAS_SUCCESSFUL"
          if [ -z "$WAS_SUCCESSFUL" ] && [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected was_successful output or action failure"
            exit 1
          fi
          echo "PASS: action ran and produced output or failed gracefully"

      - name: Assert created_pull_numbers output exists
        env:
          CREATED_PULL_NUMBERS: ${{ steps.action.outputs.created_pull_numbers }}
        run: |
          echo "created_pull_numbers: '$CREATED_PULL_NUMBERS'"
          echo "PASS: created_pull_numbers output checked"
