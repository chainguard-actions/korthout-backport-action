name: Test custom branch name template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/10/merge
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          branch_name: "bp-${pull_number}-${target_branch}"
          pull_title: "[BP ${target_branch}] ${pull_title}"
          pull_description: |
            Backport of #${pull_number} to `${target_branch}`.
          target_branches: ""

      - name: Assert action ran without unexpected crash
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "was_successful: ${{ steps.action.outputs.was_successful }}"
          echo "created_pull_numbers: ${{ steps.action.outputs.created_pull_numbers }}"
          # The action should either succeed or fail gracefully (not cancelled)
          if [ "${{ steps.action.outcome }}" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly cancelled"
            exit 1
          fi
          echo "PASS: action completed with outcome '${{ steps.action.outcome }}'"
