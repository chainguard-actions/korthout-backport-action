name: Test copy_requested_reviewers and add_author_as_reviewer conflict is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          source_pr_number: "1"
          copy_requested_reviewers: "true"
          add_author_as_reviewer: "true"
      - name: Assert action failed on validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.was_successful }}
        run: |
          echo "outcome: $OUTCOME"
          echo "was_successful: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both reviewer options are enabled"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no outputs when input validation fails"
            exit 1
          fi
          echo "PASS"
