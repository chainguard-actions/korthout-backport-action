name: Test cherry-pick and merge commit options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: backport
        uses: .
        continue-on-error: true
        with:
          source_pr_number: "99999"
          target_branches: "release-2.0"
          cherry_picking: "pull_request_head"
          merge_commits: "skip"
          comment_style: "summary"
          github_token: ${{ github.token }}

      - name: Assert action ran with cherry-pick options
        env:
          OUTCOME: ${{ steps.backport.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: expected step outcome to be set"
            exit 1
          fi
          # The action should fail (no real PR) or succeed — either is valid
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with cherry_picking=pull_request_head and merge_commits=skip, outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - id: backport_invalid
        uses: .
        continue-on-error: true
        with:
          source_pr_number: "99999"
          target_branches: "release-2.0"
          cherry_picking: "invalid_value"
          github_token: ${{ github.token }}

      - name: Assert action fails on invalid cherry_picking value
        env:
          OUTCOME: ${{ steps.backport_invalid.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid cherry_picking value, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid cherry_picking='invalid_value'"
