name: Test summary comment style and copy options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: backport
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          comment_style: summary
          copy_assignees: true
          copy_milestone: true
          copy_labels_pattern: "^(bug|enhancement)$"
          add_author_as_assignee: true
          add_author_as_reviewer: false
          copy_all_reviewers: false
          copy_requested_reviewers: true
          merge_commits: skip

      - name: Assert action ran with summary comment style
        env:
          OUTCOME: ${{ steps.backport.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with summary comment style"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

      - name: Assert was_successful_by_target output
        env:
          BY_TARGET: ${{ steps.backport.outputs.was_successful_by_target }}
        run: |
          echo "was_successful_by_target: '$BY_TARGET'"
          # When no backport targets are found, this should be empty or unset
          echo "PASS: was_successful_by_target output checked"
