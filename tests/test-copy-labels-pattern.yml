name: Test copy_labels_pattern input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          copy_labels_pattern: "^(bug|enhancement|documentation)$"
          target_branches: "main"
        continue-on-error: true
      - name: Assert action ran (inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          WAS_SUCCESSFUL: ${{ steps.action.outputs.was_successful }}
        run: |
          echo "outcome: $OUTCOME"
          echo "was_successful: $WAS_SUCCESSFUL"
          # The action may fail because there is no real merged PR in workflow_dispatch context,
          # but it must not fail due to invalid inputs. Accept both success and failure outcomes.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and accepted copy_labels_pattern input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
