name: Test copy_labels_pattern input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          source_pr_number: "1"
          target_branches: "main"
          copy_labels_pattern: "^bug$|^enhancement$"
      - name: Assert action ran with copy_labels_pattern
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because there's no real PR #1 in this repo,
          # but it should have been invoked with the copy_labels_pattern input.
          # We accept either success or failure as long as it ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with copy_labels_pattern input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
